name: v0.9.5 Candidate Evidence

on:
  pull_request:
    paths-ignore:
      - "verification/v0.9.5-platform/**"

permissions:
  actions: read
  contents: write

env:
  RUST_TOOLCHAIN: 1.98.0
  PRODUCT_VERSION_OUTPUT: docmost-local-mcp 0.9.5

jobs:
  build:
    name: Evidence (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: docmost-local-mcp
          - id: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: docmost-local-mcp
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: docmost-local-mcp
          - id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: docmost-local-mcp
          - id: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: docmost-local-mcp.exe
          - id: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: docmost-local-mcp.exe

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Build, execute, hash, and inspect native candidate
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          exec > >(tee "evidence/${{ matrix.id }}.log") 2>&1
          echo 'schema_version=1'
          echo "source_commit=$(git rev-parse HEAD)"
          echo "source_tree=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          echo "provider_run_id=$GITHUB_RUN_ID"
          echo "provider_run_attempt=$GITHUB_RUN_ATTEMPT"
          echo "provider_job=$GITHUB_JOB"
          echo "provider_repository=$GITHUB_REPOSITORY"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "target_triple=${{ matrix.target }}"
          rustc -Vv
          cargo -V
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export CARGO_INCREMENTAL=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=."
          cargo build --locked --release --no-default-features --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -s "$binary"
          version_output=$("$binary" --version | tr -d '\r')
          test "$version_output" = "$PRODUCT_VERSION_OUTPUT"
          echo "product_version_output=$version_output"
          echo "artifact_name=docmost-local-mcp-${{ matrix.id }}${{ endsWith(matrix.binary, '.exe') && '.exe' || '' }}"
          echo "artifact_size=$(wc -c < "$binary" | tr -d ' ')"
          echo "artifact_sha256=$(sha256sum "$binary" | awk '{print $1}')"
          llvm_readobj=$(find "$(rustc --print sysroot)" -type f \( -name llvm-readobj -o -name llvm-readobj.exe \) | head -1)
          test -n "$llvm_readobj"
          "$llvm_readobj" --file-headers "$binary"

      - name: Upload bounded evidence and ephemeral binary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: platform-${{ matrix.id }}
          path: |
            evidence/${{ matrix.id }}.log
            target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  retain-evidence:
    name: Retain sanitized platform records
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download exact build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: platform-*
          path: downloaded

      - name: Validate and commit bounded records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out=verification/v0.9.5-platform
          mkdir -p "$out/records"
          source_tree=$(git rev-parse "$SOURCE_COMMIT^{tree}")
          find downloaded -type f -name '*.log' -exec cp {} "$out/records/" \;
          test "$(find "$out/records" -type f -name '*.log' | wc -l | tr -d ' ')" = 6
          declare -A triples=(
            [darwin-arm64]=aarch64-apple-darwin
            [darwin-x64]=x86_64-apple-darwin
            [linux-arm64]=aarch64-unknown-linux-gnu
            [linux-x64]=x86_64-unknown-linux-gnu
            [windows-arm64]=aarch64-pc-windows-msvc
            [windows-x64]=x86_64-pc-windows-msvc
          )
          declare -A binaries=(
            [darwin-arm64]=docmost-local-mcp
            [darwin-x64]=docmost-local-mcp
            [linux-arm64]=docmost-local-mcp
            [linux-x64]=docmost-local-mcp
            [windows-arm64]=docmost-local-mcp.exe
            [windows-x64]=docmost-local-mcp.exe
          )
          for id in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-arm64 windows-x64; do
            log="$out/records/$id.log"
            binary="downloaded/platform-$id/target/${triples[$id]}/release/${binaries[$id]}"
            test -s "$log" && test -s "$binary"
            test "$(grep -E '^source_commit=' "$log" | tail -1 | cut -d= -f2)" = "$SOURCE_COMMIT"
            test "$(grep -E '^source_tree=' "$log" | tail -1 | cut -d= -f2)" = "$source_tree"
            test "$(grep -E '^product_version_output=' "$log" | tail -1 | cut -d= -f2-)" = 'docmost-local-mcp 0.9.5'
            recorded_sha=$(grep -E '^artifact_sha256=' "$log" | tail -1 | cut -d= -f2 | tr -d '\r')
            actual_sha=$(sha256sum "$binary" | cut -d' ' -f1)
            test "$recorded_sha" = "$actual_sha"
          done
          grep -Eq 'Format: Mach-O.*arm64|Arch: aarch64' "$out/records/darwin-arm64.log"
          grep -Eq 'Format: Mach-O.*x86-64|Arch: x86_64' "$out/records/darwin-x64.log"
          grep -Eq 'Format: elf64-littleaarch64|Arch: aarch64|Machine: EM_AARCH64' "$out/records/linux-arm64.log"
          grep -Eq 'Format: elf64-x86-64|Arch: x86_64|Machine: EM_X86_64' "$out/records/linux-x64.log"
          grep -Eq 'Format: COFF-ARM64|Arch: aarch64|Machine: IMAGE_FILE_MACHINE_ARM64' "$out/records/windows-arm64.log"
          grep -Eq 'Format: COFF-x86-64|Arch: x86_64|Machine: IMAGE_FILE_MACHINE_AMD64' "$out/records/windows-x64.log"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '{run_id:'"$GITHUB_RUN_ID"',run_attempt:'"$GITHUB_RUN_ATTEMPT"',jobs:[.jobs[]|{id,name,runner_name,status,conclusion,html_url}]}' \
            > "$out/provider-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '{run_id:'"$GITHUB_RUN_ID"',artifacts:[.artifacts[]|select(.name|startswith("platform-"))|{id,name,size_in_bytes,digest,expired,expires_at}]}' \
            > "$out/provider-artifacts.json"
          {
            echo 'schema_version=1'
            echo "source_commit=$SOURCE_COMMIT"
            echo "source_tree=$source_tree"
            echo "provider_repository=$GITHUB_REPOSITORY"
            echo "provider_run_id=$GITHUB_RUN_ID"
            echo "provider_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo 'binaries_retained_in_git=false'
            echo 'provider_artifact_retention_days=1'
            for id in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-arm64 windows-x64; do
              log="$out/records/$id.log"
              sha=$(grep -E '^artifact_sha256=' "$log" | tail -1 | cut -d= -f2 | tr -d '\r')
              size=$(grep -E '^artifact_size=' "$log" | tail -1 | cut -d= -f2 | tr -d '\r')
              triple=$(grep -E '^target_triple=' "$log" | tail -1 | cut -d= -f2 | tr -d '\r')
              name=$(grep -E '^artifact_name=' "$log" | tail -1 | cut -d= -f2- | tr -d '\r')
              version=$(grep -E '^product_version_output=' "$log" | tail -1 | cut -d= -f2- | tr -d '\r')
              echo "$id|$name|$triple|$size|$sha|$version|records/$id.log"
            done
          } > "$out/artifact-manifest.txt"
          if grep -R -E -i '(authorization:|bearer[[:space:]]|gh[pousr]_[A-Za-z0-9]|api[_-]?key|password=|cookie:)' "$out"; then
            echo 'potential secret material found' >&2
            exit 1
          fi
          (cd "$out" && sha256sum artifact-manifest.txt provider-*.json records/*.log | LC_ALL=C sort) > "$out/SHA256SUMS"
          git add -f "$out"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(verification): retain v0.9.5 platform evidence'
          git push origin "HEAD:$HEAD_REF"
