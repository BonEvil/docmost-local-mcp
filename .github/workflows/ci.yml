name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-headless
            os: ubuntu-24.04
            args: --no-default-features
          - name: macos-compatibility-feature
            os: macos-15
            args: --all-features
          - name: windows-compatibility-feature
            os: windows-2025
            args: --all-features
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action commit
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Run format check
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings

      - name: Run tests
        run: cargo test --locked ${{ matrix.args }}

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check Cargo.lock is reproducible
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null

      - name: Enforce advisory and supply-chain policy
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check advisories bans licenses sources

  launcher-smoke:
    name: Launcher Smoke Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - name: Create mock binary
        run: |
          mkdir -p npm/launcher/bin
          cat <<'EOF' > npm/launcher/bin/docmost-local-mcp
          #!/usr/bin/env sh
          echo "launcher-smoke:$*"
          EOF
          chmod +x npm/launcher/bin/docmost-local-mcp

      - name: Run launcher smoke test
        run: |
          output=$(node npm/launcher/cli.js --ping)
          test "$output" = "launcher-smoke:--ping"

      - name: Verify postinstall syntax
        run: node --check npm/launcher/postinstall.js

  release-integrity:
    name: Release integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run installer failure-path tests
        run: |
          bash tests/release_integrity_test.sh
          bash tests/cosign_installer_contract_test.sh
          bash tests/version_consistency_test.sh
          bash tests/release_context_test.sh

      - name: Enforce immutable CI inputs
        run: bash scripts/check-pinned-inputs.sh

  platform-builds:
    name: Platform Build (${{ matrix.target.id }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: darwin-arm64
            runner: macos-15
          - id: darwin-x64
            runner: macos-15-intel
          - id: linux-arm64
            runner: ubuntu-24.04-arm
          - id: linux-x64
            runner: ubuntu-24.04
          - id: win32-arm64
            runner: windows-11-arm
          - id: win32-x64
            runner: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action commit
        with:
          toolchain: 1.98.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Build Rust binary
        run: cargo build --locked --release --no-default-features

  security-release-gate:
    name: Integrated security and release gate
    runs-on: ubuntu-24.04
    needs:
      - rust-checks
      - dependency-policy
      - launcher-smoke
      - release-integrity
      - platform-builds
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify integrated operating evidence is present
        run: |
          test -s docs/operations-and-maintenance.md
          test -s verification/security-invariant-coverage.md
          grep -q 'Docmost Community v0.95.0' docs/operations-and-maintenance.md
          grep -q 'Deployment stays disabled' docs/operations-and-maintenance.md
          git diff --check
