name: v0.9.4 Platform Evidence

on:
  pull_request:
    paths-ignore:
      - "verification/v0.9.4-platform/**"

permissions:
  contents: read

env:
  SOURCE_COMMIT: d1fbff9b5c35bb05a435c3e4f97ec60fe3300dcc
  SOURCE_TREE: 3a48db6f53611000845330c0527274e83a22fb00
  RUST_TOOLCHAIN: 1.98.0

jobs:
  build:
    if: github.event.pull_request.head.sha == 'c852b38cef32392bb85598f6c45e873f935d9b71'
    name: Evidence (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: docmost-local-mcp
            shell: bash
          - id: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: docmost-local-mcp
            shell: bash
          - id: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: docmost-local-mcp.exe
            shell: pwsh
          - id: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: docmost-local-mcp.exe
            shell: pwsh

    steps:
      - name: Checkout immutable source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: llvm-tools-preview

      - name: Build and inspect Darwin executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          exec > >(tee "evidence/${{ matrix.id }}.log") 2>&1
          echo "schema_version=1"
          echo "source_commit=$(git rev-parse HEAD)"
          echo "source_tree=$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          echo "provider_run_id=$GITHUB_RUN_ID"
          echo "provider_run_attempt=$GITHUB_RUN_ATTEMPT"
          echo "provider_job=$GITHUB_JOB"
          echo "provider_repository=$GITHUB_REPOSITORY"
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          echo "target_triple=${{ matrix.target }}"
          sw_vers
          uname -a
          rustc -Vv
          cargo -V
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export CARGO_INCREMENTAL=0
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=."
          cargo build --locked --release --no-default-features --target "${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -x "$binary"
          echo "artifact_name=docmost-local-mcp-${{ matrix.id }}"
          echo "artifact_size=$(stat -f %z "$binary")"
          echo "artifact_sha256=$(shasum -a 256 "$binary" | awk '{print $1}')"
          file "$binary"
          llvm_readobj=$(find "$(rustc --print sysroot)" -type f -name llvm-readobj | head -1)
          test -n "$llvm_readobj"
          "$llvm_readobj" --file-headers "$binary"

      - name: Build and inspect Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          Start-Transcript -Path "evidence/${{ matrix.id }}.log"
          try {
            Write-Output 'schema_version=1'
            $commit = git rev-parse HEAD
            $tree = git rev-parse 'HEAD^{tree}'
            Write-Output "source_commit=$commit"
            Write-Output "source_tree=$tree"
            if ($commit -ne $env:SOURCE_COMMIT) { throw 'source commit mismatch' }
            if ($tree -ne $env:SOURCE_TREE) { throw 'source tree mismatch' }
            Write-Output "provider_run_id=$env:GITHUB_RUN_ID"
            Write-Output "provider_run_attempt=$env:GITHUB_RUN_ATTEMPT"
            Write-Output "provider_job=$env:GITHUB_JOB"
            Write-Output "provider_repository=$env:GITHUB_REPOSITORY"
            Write-Output "runner_name=$env:RUNNER_NAME"
            Write-Output "runner_os=$env:RUNNER_OS"
            Write-Output "runner_arch=$env:RUNNER_ARCH"
            Write-Output 'target_triple=${{ matrix.target }}'
            Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsArchitecture | Format-List
            rustc -Vv
            cargo -V
            $env:SOURCE_DATE_EPOCH = git show -s --format=%ct HEAD
            $env:CARGO_INCREMENTAL = '0'
            $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=."
            cargo build --locked --release --no-default-features --target '${{ matrix.target }}'
            if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
            $binary = 'target/${{ matrix.target }}/release/${{ matrix.binary }}'
            if (-not (Test-Path $binary -PathType Leaf)) { throw 'binary missing' }
            $hash = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
            $size = (Get-Item $binary).Length
            Write-Output 'artifact_name=docmost-local-mcp-${{ matrix.id }}.exe'
            Write-Output "artifact_size=$size"
            Write-Output "artifact_sha256=$hash"
            $llvmReadObj = Get-ChildItem (rustc --print sysroot) -Recurse -Filter llvm-readobj.exe | Select-Object -First 1 -ExpandProperty FullName
            if (-not $llvmReadObj) { throw 'llvm-readobj.exe missing' }
            & $llvmReadObj --file-headers $binary
            if ($LASTEXITCODE -ne 0) { throw 'llvm-readobj failed' }
          } finally {
            Stop-Transcript
          }

      - name: Upload bounded evidence and ephemeral binary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: platform-${{ matrix.id }}
          path: |
            evidence/${{ matrix.id }}.log
            target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  retain-evidence:
    if: github.event.pull_request.head.sha == 'c852b38cef32392bb85598f6c45e873f935d9b71'
    name: Retain sanitized platform records
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact review branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download platform artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: platform-*
          path: downloaded

      - name: Assemble bounded committed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          out=verification/v0.9.4-platform
          mkdir -p "$out/records"
          find downloaded -type f -name '*.log' -exec cp {} "$out/records/" \;
          test "$(find "$out/records" -type f -name '*.log' | wc -l | tr -d ' ')" = 4
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '{run_id:'"$GITHUB_RUN_ID"',run_attempt:'"$GITHUB_RUN_ATTEMPT"',jobs:[.jobs[]|select(.name|startswith("Evidence ("))|{id,name,runner_name,conclusion,html_url}]}' \
            > "$out/provider-jobs.json"
          {
            echo 'schema_version=1'
            echo "source_commit=$SOURCE_COMMIT"
            echo "source_tree=$SOURCE_TREE"
            echo "provider_repository=$GITHUB_REPOSITORY"
            echo "provider_run_id=$GITHUB_RUN_ID"
            echo "provider_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "provider_run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'artifacts_retained_in_git=false'
            echo 'provider_artifact_retention_days=1'
            for log in "$out"/records/*.log; do
              id=$(basename "$log" .log)
              sha=$(grep -E '^artifact_sha256=' "$log" | tail -1 | cut -d= -f2)
              size=$(grep -E '^artifact_size=' "$log" | tail -1 | cut -d= -f2)
              triple=$(grep -E '^target_triple=' "$log" | tail -1 | cut -d= -f2)
              name=$(grep -E '^artifact_name=' "$log" | tail -1 | cut -d= -f2-)
              test -n "$sha" && test -n "$size" && test -n "$triple" && test -n "$name"
              echo "$id|$name|$triple|$size|$sha|records/$id.log"
            done
          } > "$out/artifact-manifest.txt"
          (cd "$out" && sha256sum artifact-manifest.txt provider-jobs.json records/*.log | LC_ALL=C sort) > "$out/SHA256SUMS"
          grep -R -E 'Mach-O 64-bit.*arm64|Arch: aarch64|Cpu: Arm64' "$out/records/darwin-arm64.log"
          grep -R -E 'Mach-O 64-bit.*x86_64|Arch: x86_64|Cpu: X86_64' "$out/records/darwin-x64.log"
          grep -R -E 'Format: COFF-ARM64|Arch: aarch64|Machine: IMAGE_FILE_MACHINE_ARM64' "$out/records/windows-arm64.log"
          grep -R -E 'Format: COFF-x86-64|Arch: x86_64|Machine: IMAGE_FILE_MACHINE_AMD64' "$out/records/windows-x64.log"
          if grep -R -E -i '(authorization:|bearer[[:space:]]|gh[pousr]_[A-Za-z0-9]|api[_-]?key|password=|cookie:)' "$out"; then
            echo 'potential secret material found' >&2
            exit 1
          fi
          git add "$out"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(verification): retain v0.9.4 platform evidence'
          git push origin "HEAD:$HEAD_REF"
